name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  version: osslsigncode-2.17-dev

jobs:
  release-checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test release safety checks
        run: |
          python3 -B -m unittest discover -s tests -p test_release_workflow.py
          sh -n .github/scripts/build-linux-release.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-24.04
            triplet: x64-linux
            compiler: gcc
            os: ubuntu-24.04
            generator: Unix Makefiles
            vcpkg_root:
          - id: ubuntu-22.04
            triplet: x64-linux
            compiler: gcc
            os: ubuntu-22.04
            generator: Unix Makefiles
            vcpkg_root:
          - id: macOS
            triplet: arm64-osx
            compiler: clang
            os: macOS-latest
            generator: Unix Makefiles
            vcpkg_root: /usr/local/share/vcpkg
          - id: windows-x64-vs
            triplet: x64-windows
            compiler: vs
            arch: x64
            os: windows-2022
            generator: Ninja
            vcpkg_root: C:/vcpkg
            cache: C:/Users/runneradmin/AppData/Local/vcpkg/archives
          - id: windows-x86-vs
            triplet: x86-windows
            compiler: vs
            arch: x86
            os: windows-2022
            generator: Ninja
            vcpkg_root: C:/vcpkg
            cache: C:/Users/runneradmin/AppData/Local/vcpkg/archives
          - id: windows-x64-static-vs
            triplet: x64-windows-static
            compiler: vs
            arch: x64
            os: windows-2022
            generator: Ninja
            vcpkg_root: C:/vcpkg
            cache: C:/Users/runneradmin/AppData/Local/vcpkg/archives
          - id: windows-x64-mingw
            triplet: x64-windows
            compiler: mingw
            os: windows-2022
            generator: Ninja
            vcpkg_root: C:/vcpkg
            cache: C:/Users/runneradmin/AppData/Local/vcpkg/archives

    runs-on: ${{matrix.os}}

    env:
      VCPKG_ROOT: ${{matrix.vcpkg_root}}

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false

    # Package ABIs can change with the runner image and its vcpkg checkout, so a
    # key based only on vcpkg.json can keep restoring unusable archives. The
    # MSVC jobs use Visual Studio's bundled vcpkg instead, which ImageVersion
    # covers; the revision only matters where ImageVersion is unset.
    - name: Identify vcpkg build inputs
      if: matrix.cache != ''
      id: vcpkg-inputs
      shell: pwsh
      run: |
        $revision = git -C "${{matrix.vcpkg_root}}" rev-parse HEAD
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "revision=$revision" >> $env:GITHUB_OUTPUT
        "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

    # A PR run searches all of its own keys before any base-branch cache, so a
    # broad fallback here would let a stale PR archive win over a matching one
    # from master. Match the current build inputs in every scope first.
    - name: Restore the vcpkg archives
      if: matrix.cache != ''
      id: vcpkg-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{matrix.cache}}
        key: ${{matrix.id}}-v2-${{steps.vcpkg-inputs.outputs.image}}-${{steps.vcpkg-inputs.outputs.revision}}-${{hashFiles('vcpkg.json')}}
        restore-keys: |
          ${{matrix.id}}-v2-${{steps.vcpkg-inputs.outputs.image}}-${{steps.vcpkg-inputs.outputs.revision}}-
          ${{matrix.id}}-v2-${{steps.vcpkg-inputs.outputs.image}}-

    # Older archives remain useful: vcpkg validates each package's ABI itself.
    - name: Restore older vcpkg archives
      if: matrix.cache != '' && steps.vcpkg-cache.outputs.cache-matched-key == ''
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{matrix.cache}}
        key: ${{matrix.id}}-v2-
        restore-keys: |
          ${{matrix.id}}-

    - name: Configure Visual Studio
      if: matrix.compiler == 'vs'
      uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1
      with:
        arch: ${{matrix.arch}}

    - name: Install MSYS2
      if: matrix.compiler == 'mingw'
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
      with:
        update: true
        install: mingw-w64-x86_64-ninja

    - name: Put MSYS2_MinGW64 on PATH
      if: matrix.compiler == 'mingw'
      run: echo "D:/a/_temp/msys64/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Set up Python (macOS)
      if: runner.os == 'macOS'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
          python-version: '3.13'
          update-environment: false
          architecture: 'arm64'

    - name: Set up Python virtual environment (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        python -m venv --system-site-packages --copies venv

    - name: Set up Python virtual environment (Windows)
      if: runner.os == 'Windows'
      run: |
        python.exe -m venv --system-site-packages --copies venv

    - name: Install Xcode (macOS)
      if: runner.os == 'macOS'
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
      with:
        xcode-version: latest-stable

    - name: Setup the oldest supported version of cmake (macOS)
      if: runner.os == 'macOS'
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0

    - name: Install python3 cryptography module (Linux)
      if: runner.os == 'Linux'
      run: |
        source venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install --upgrade cryptography
        python -c "import sys; print(sys.executable)"
        python --version
        python -c "import cryptography; print(f'Python3 cryptography version {cryptography.__version__}')"

    - name: Install python3 cryptography module (macOS)
      if: runner.os == 'macOS'
      run: |
        source venv/bin/activate
        python -m pip install --upgrade pip
        ARCHFLAGS="-arch arm64" python -m pip install --upgrade cryptography
        python -c "import sys; print(sys.executable)"
        python --version
        python -c "import cryptography; print(f'Python3 cryptography version {cryptography.__version__}')"

    - name: Install python3 cryptography module (Windows)
      if: runner.os == 'Windows'
      run: |
        .\venv\Scripts\Activate.ps1
        python.exe -m ensurepip
        python.exe -m pip install --upgrade pip
        python.exe -m pip install cryptography
        python.exe -c "import sys; print(sys.executable)"
        python.exe --version
        python.exe -c "import cryptography; print(f'Python3 cryptography version {cryptography.__version__}')"

    - name: Configure CMake (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        source venv/bin/activate
        cmake \
          -G "${{matrix.generator}}" \
          -S "${{github.workspace}}" \
          -B "${{github.workspace}}/build" \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_BUILD_TYPE="${{env.BUILD_TYPE}}" \
          -DCMAKE_INSTALL_PREFIX="${{github.workspace}}/dist"

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        .\venv\Scripts\Activate.ps1
        cmake `
          -G "${{matrix.generator}}" `
          -S "${{github.workspace}}" `
          -B "${{github.workspace}}/build" `
          -DCMAKE_BUILD_TYPE="${{env.BUILD_TYPE}}" `
          -DCMAKE_INSTALL_PREFIX="${{github.workspace}}/dist"

    # Restored archives may include packages for older build inputs. Keep only
    # the ABIs this configuration installed, so the cache does not grow.
    - name: Drop unused vcpkg archives
      if: matrix.cache != '' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $status = "${{github.workspace}}/build/vcpkg_installed/vcpkg/status"
        if (!(Test-Path $status) -or !(Test-Path "${{matrix.cache}}")) { exit 0 }
        $used = Select-String -Path $status -Pattern '^Abi: (\w+)' |
          ForEach-Object { $_.Matches[0].Groups[1].Value }
        if (!$used) { exit 0 }
        Get-ChildItem "${{matrix.cache}}" -Recurse -File -Filter *.zip |
          Where-Object { $used -notcontains $_.BaseName } |
          Remove-Item

    # vcpkg installs dependencies during CMake configuration. Persist new
    # binaries before build or test failures can prevent a cache save.
    - name: Save the vcpkg archives
      if: matrix.cache != '' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{matrix.cache}}
        key: ${{steps.vcpkg-cache.outputs.cache-primary-key}}

    - name: Build
      run: cmake
        --build ${{github.workspace}}/build
        --config ${{env.BUILD_TYPE}}

    - name: List files (Linux/macOS)
      if: runner.os != 'Windows'
      run: find .. -ls

    - name: List files (Windows)
      if: runner.os == 'Windows'
      run: Get-ChildItem -Recurse -Name ..

    - name: Test (Linux/macOS)
      if: runner.os != 'Windows'
      working-directory: ${{github.workspace}}/build
      run: |
        source ../venv/bin/activate
        ctest -C ${{env.BUILD_TYPE}}

    - name: Test (Windows)
      if: runner.os == 'Windows'
      working-directory: ${{github.workspace}}/build
      run: |
        ..\venv\Scripts\Activate.ps1
        ctest -C ${{env.BUILD_TYPE}}

    - name: Upload the errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      if: failure()
      with:
        name: errors-${{matrix.id}}
        path: |
          ${{github.workspace}}/build/Testing/Temporary/LastTest.log
          ${{github.workspace}}/build/Testing/conf/makecerts.log
          ${{github.workspace}}/build/Testing/logs/server.log
          ${{github.workspace}}/build/Testing/logs/port.log

    - name: Install
      run: cmake --install ${{github.workspace}}/build

    - name: Upload the executables
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: ${{env.version}}-${{matrix.id}}
        path: ${{github.workspace}}/dist
