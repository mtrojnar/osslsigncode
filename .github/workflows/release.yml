name: Release

# Build portable, release binaries for every supported architecture on a
# version tag, then attach them (plus a SHA256SUMS.txt for pinning) to the
# GitHub release.
#
#   Linux   -> fully-static musl binaries (zero shared-lib deps), built in
#              Alpine on native amd64 and arm64 runners.
#   macOS   -> arm64 + x86_64, OpenSSL and zlib built from source and linked
#              statically; only system libs remain dynamic.
#   Windows -> arm64 + x64 static (MSVC static CRT, OpenSSL and zlib built from
#              source) -> single self contained .exe.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+-*'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version string to embed in asset names (e.g. 2.15).'
        required: true

env:
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Linux: fully-static musl binaries. Alpine is the canonical place static
  # linking of OpenSSL + zlib
  # --------------------------------------------------------------------------
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
            py_arch: x64
          - arch: arm64
            os: ubuntu-24.04-arm
            py_arch: arm64
    runs-on: ${{ matrix.os }}
    container: alpine:3.24
    steps:
      # Handle github actions shenanigans on linux alpine arm
      - uses: laverdet/alpine-arm64@v1
        if: matrix.arch == 'arm64'

      # Get the version currently being built
      - name: Resolve version
        run: echo "VERSION=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Install system packages
        shell: sh
        run: |
          apk add --update --no-cache \
            git bash build-base cmake ninja \
            python3 py3-cryptography py3-pip openssl \
            openssl-dev openssl-libs-static \
            wget tar perl \
            zlib-dev zlib-static linux-headers

      # Ensure the cryptography package is available
      - name: Validate Python Setup
        run: |
          python -c "import sys; print(sys.executable)"
          python --version
          python -c "import cryptography; print(f'Python3 cryptography version {cryptography.__version__}')"

      # Checkout the specific tag/reference the run is targeting (for back
      # porting).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Configure
        run: |
          cmake -G 'Unix Makefiles' -S "$GITHUB_WORKSPACE" -B build \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DZLIB_USE_STATIC_LIBS=TRUE \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DCMAKE_EXE_LINKER_FLAGS="-static -s"

      - name: Build
        run: cmake --build build

      - name: Verify the binary is fully static
        run: |
          bin="build/osslsigncode"
          file "$bin"
          # Newer toolchains produce static PIE binaries, which are equally
          # self-contained.
          if ! file "$bin" | grep -Eq 'statically linked|static-pie linked'; then
            echo "::error::binary is not fully static"
            ldd "$bin" || true
            exit 1
          fi

      - name: Test
        working-directory: build
        run: |
          ctest --output-on-failure -C "$BUILD_TYPE"

      - name: Upload the errors
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: errors-${{matrix.os}}
          path: |
            ${{github.workspace}}/build/Testing/Temporary/LastTest.log
            ${{github.workspace}}/build/Testing/conf/makecerts.log
            ${{github.workspace}}/build/Testing/logs/server.log
            ${{github.workspace}}/build/Testing/logs/port.log

      - name: Package
        run: |
          asset="osslsigncode-${VERSION}-linux-${{ matrix.arch }}"
          install -Dm755 build/osslsigncode "stage/${asset}/osslsigncode"
          cp COPYING "stage/${asset}/" 2>/dev/null || true
          tar -C stage -czf "${asset}.tar.gz" "${asset}"
          sha256sum "${asset}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: osslsigncode-*-linux-*.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # macOS: arm64 + x86_64. OpenSSL and zlib are built from source as static
  # libraries for the minimum supported macOS, so the binary depends only on
  # always-present system libraries. (A truly static binary is not possible on
  # macOS -- libSystem must be dynamic.)
  # --------------------------------------------------------------------------
  macos:
    name: macos-${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            os: macos-26
            triplet: arm64-osx
            osx_arch: arm64
            py_arch: arm64
          - arch: amd64
            os: macos-26-intel
            triplet: x64-osx
            osx_arch: x86_64
            py_arch: x64
    runs-on: ${{ matrix.os }}
    env:
      # The minimum supported macOS. clang and CMake both read this, so the
      # dependencies and osslsigncode itself are all built for it.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ZLIB_VERSION: 1.3.1
      ZLIB_SHA256: 9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23
      ZLIB_PREFIX: /tmp/zlibinstall
      OPENSSL_VERSION: 3.5.9
      OPENSSL_SHA256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
      OPENSSL_PREFIX: /tmp/opensslinstall
    steps:
      - name: Resolve version
        run: echo "VERSION=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      # Neither the runner nor vcpkg's pinned baseline provides static
      # libraries built for the minimum supported macOS: Homebrew bottles
      # target the runner's macOS, and the baseline's zlib does not build with
      # current SDKs. Build and cache both libraries instead.
      - name: Restore cached ZLib
        id: cache-zlib
        uses: actions/cache@v6
        with:
          path: "${{env.ZLIB_PREFIX}}"
          key: zlib-${{ env.ZLIB_VERSION }}-static-${{ matrix.arch }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}
      - name: Build ZLib
        if: steps.cache-zlib.outputs.cache-hit != 'true'
        shell: sh
        run: |
          set -eux
          cd /tmp
          wget -O zlib.tar.gz \
            "https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz"
          echo "${ZLIB_SHA256}  zlib.tar.gz" | shasum -a 256 -c
          tar xf zlib.tar.gz
          cd "zlib-${ZLIB_VERSION}"
          CFLAGS="-arch ${{ matrix.osx_arch }}" ./configure --static --prefix="${{env.ZLIB_PREFIX}}"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Restore cached OpenSSL
        id: cache-openssl
        uses: actions/cache@v6
        with:
          path: "${{env.OPENSSL_PREFIX}}"
          key: openssl-${{ env.OPENSSL_VERSION }}-static-${{ matrix.arch }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-usr-local
      - name: Build OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        shell: sh
        run: |
          set -eux
          cd /tmp
          wget -O openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          echo "${OPENSSL_SHA256}  openssl.tar.gz" | shasum -a 256 -c
          tar xf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          # no-module => legacy provider is compiled into libcrypto.a (no dlopen).
          # Keep the default /usr/local prefix and stage the installation with
          # DESTDIR: the prefix is compiled in as the engine and provider search
          # path, so it must not be a directory like /tmp that any local user
          # can write. Use the macOS system OpenSSL directory for the same
          # reason.
          ./Configure "darwin64-${{ matrix.osx_arch }}-cc" \
            no-shared no-module no-tests no-docs \
            --libdir=lib --openssldir=/etc/ssl
          make -j"$(sysctl -n hw.ncpu)"
          make install_sw DESTDIR="${{env.OPENSSL_PREFIX}}"

      # Setup xcode build environment
      - name: Install Xcode (macOS)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # By default cmake 4.0+ is used. However, this project targets a min
      # version of 3.17.
      - name: Setup the oldest supported version of cmake (macOS)
        uses: jwlawson/actions-setup-cmake@v2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{matrix.py_arch}}

      - name: Install test dependency (cryptography)
        run: |
          python -m pip install --upgrade pip
          ARCHFLAGS="-arch ${{ matrix.osx_arch }}" python -m pip install --upgrade cryptography
          python -c "import sys; print(sys.executable)"
          python --version
          python -c "import cryptography; print(f'Python3 cryptography version {cryptography.__version__}')"

      # Checkout the specific tag/reference the run is targeting (for back
      # porting).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Configure
        run: |
          cmake -G "Unix Makefiles" -S "${{github.workspace}}" -B "${{github.workspace}}/build" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.osx_arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{env.MACOSX_DEPLOYMENT_TARGET}}" \
            -DOPENSSL_ROOT_DIR="${{env.OPENSSL_PREFIX}}/usr/local" \
            -DZLIB_ROOT="${{env.ZLIB_PREFIX}}" \
            -DZLIB_USE_STATIC_LIBS=TRUE \
            -DOPENSSL_USE_STATIC_LIBS=TRUE

      # The linker only warns when it links objects built for a newer macOS
      # than the deployment target, so fail the build explicitly.
      - name: Build
        run: |
          set -o pipefail
          cmake --build "${{github.workspace}}/build" --config "$BUILD_TYPE" 2>&1 | tee build.log
          if grep -q 'was built for newer' build.log; then
            echo "::error::linked objects require a newer macOS than ${MACOSX_DEPLOYMENT_TARGET}"
            exit 1
          fi

      - name: Verify no third-party dylibs are linked
        run: |
          bin="build/osslsigncode"
          otool -L "$bin"
          if otool -L "$bin" | grep -Ei 'vcpkg|Cellar|libssl|libcrypto'; then
            echo "::error::binary links a non-system dylib"
            exit 1
          fi
          if strings "$bin" | grep -F "${OPENSSL_PREFIX}"; then
            echo "::error::binary refers to the OpenSSL staging directory"
            exit 1
          fi
          if ! "$bin" --version | grep -q "OpenSSL ${OPENSSL_VERSION} "; then
            "$bin" --version
            echo "::error::binary does not use the OpenSSL ${OPENSSL_VERSION} built above"
            exit 1
          fi
          strip -S "$bin" || true

      - name: Test
        working-directory: build
        run: |
          ctest --output-on-failure -C "$BUILD_TYPE"

      - name: Upload the errors
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: errors-${{matrix.os}}
          path: |
            ${{github.workspace}}/build/Testing/Temporary/LastTest.log
            ${{github.workspace}}/build/Testing/conf/makecerts.log
            ${{github.workspace}}/build/Testing/logs/server.log
            ${{github.workspace}}/build/Testing/logs/port.log

      - name: Package
        run: |
          asset="osslsigncode-${VERSION}-macos-${{ matrix.arch }}"
          mkdir -p "stage/${asset}"
          cp build/osslsigncode "stage/${asset}/"
          cp COPYING "stage/${asset}/" 2>/dev/null || true
          (cd stage && zip -r "../${asset}.zip" "${asset}")
          shasum -a 256 "${asset}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-${{ matrix.arch }}
          path: osslsigncode-*-macos-*.zip
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Windows: x64 + arm64, MSVC static CRT + static OpenSSL and zlib -> a single
  # self-contained .exe (no vcredist / no third-party DLLs).
  # --------------------------------------------------------------------------
  windows:
    name: windows-${{matrix.arch}}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            os: windows-11-arm
            vs_arch: arm64
            openssl_target: VC-WIN64-CLANGASM-ARM
          - arch: amd64
            os: windows-latest
            vs_arch: amd64
            openssl_target: VC-WIN64A
    runs-on: ${{matrix.os}}
    env:
      ZLIB_VERSION: 1.3.2
      ZLIB_SHA256: bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16
      OPENSSL_VERSION: 3.5.9
      OPENSSL_SHA256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
      NASM_VERSION: "3.02"
      NASM_SHA256: 161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7
    steps:
      - name: Resolve version
        shell: bash
        run: echo "VERSION=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Configure Visual Studio
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.vs_arch}}

      # Python setup
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install test dependency (cryptography)
        run: |
          python -m ensurepip
          python -m pip install --upgrade pip
          python -m pip install --upgrade pip cryptography
          python.exe -c "import sys; print(sys.executable)"
          python.exe --version
          python.exe -c "import cryptography; print(f'Python3 cryptography version {cryptography.__version__}')"

      # Checkout the specific tag/reference the run is targeting (for back
      # porting).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      # vcpkg's pinned baseline ships OpenSSL releases that are no longer
      # supported, so build the same pinned OpenSSL as the macOS job, and zlib.
      # The libraries are cached per MSVC toolset, because a toolset must not
      # be older than the one that built the libraries it links.
      #
      # Avoid environment variable names that OpenSSL's makefile also defines,
      # such as DEPS: nmake exports makefile macros over them.
      - name: Set dependency paths
        shell: pwsh
        run: |
          "OSSLSIGNCODE_DEPS=$env:RUNNER_TEMP\deps" >> $env:GITHUB_ENV

      - name: Restore cached ZLib
        id: cache-zlib
        uses: actions/cache@v6
        with:
          path: ${{ env.OSSLSIGNCODE_DEPS }}/zlib
          key: zlib-${{ env.ZLIB_VERSION }}-static-${{ matrix.arch }}-windows-msvc${{ env.VCToolsVersion }}
      - name: Build ZLib
        if: steps.cache-zlib.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location $env:RUNNER_TEMP
          Invoke-WebRequest -OutFile zlib.tar.gz `
            "https://github.com/madler/zlib/releases/download/v$env:ZLIB_VERSION/zlib-$env:ZLIB_VERSION.tar.gz"
          if ((Get-FileHash zlib.tar.gz -Algorithm SHA256).Hash -ne $env:ZLIB_SHA256) {
            throw "zlib.tar.gz: checksum mismatch"
          }
          tar xf zlib.tar.gz
          cmake -G Ninja -S "zlib-$env:ZLIB_VERSION" -B zlib-build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DZLIB_BUILD_SHARED=OFF `
            -DZLIB_BUILD_TESTING=OFF `
            -DCMAKE_INSTALL_PREFIX="$env:OSSLSIGNCODE_DEPS\zlib"
          cmake --build zlib-build
          cmake --install zlib-build

      - name: Restore cached OpenSSL
        id: cache-openssl
        uses: actions/cache@v6
        with:
          path: ${{ env.OSSLSIGNCODE_DEPS }}/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-static-${{ matrix.arch }}-windows-msvc${{ env.VCToolsVersion }}
      # OpenSSL needs NASM for its x64 assembly; arm64 uses clang-cl instead.
      - name: Install NASM
        if: steps.cache-openssl.outputs.cache-hit != 'true' && matrix.arch == 'amd64'
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          Invoke-WebRequest -OutFile nasm.zip `
            "https://www.nasm.us/pub/nasm/releasebuilds/$env:NASM_VERSION/win64/nasm-$env:NASM_VERSION-win64.zip"
          if ((Get-FileHash nasm.zip -Algorithm SHA256).Hash -ne $env:NASM_SHA256) {
            throw "nasm.zip: checksum mismatch"
          }
          Expand-Archive nasm.zip -DestinationPath .
          "$env:RUNNER_TEMP\nasm-$env:NASM_VERSION" >> $env:GITHUB_PATH
      # Keep OpenSSL's default prefix under Program Files and stage the
      # installation with DESTDIR: the prefix is compiled into the library as
      # the engine and provider search path, so it must not be a directory
      # that unprivileged users can create on the machines running the binary.
      - name: Build OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ("${{ matrix.arch }}" -eq "arm64") {
            $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
            clang-cl --version
          } else {
            nasm -v
          }
          Set-Location $env:RUNNER_TEMP
          Invoke-WebRequest -OutFile openssl.tar.gz `
            "https://github.com/openssl/openssl/releases/download/openssl-$env:OPENSSL_VERSION/openssl-$env:OPENSSL_VERSION.tar.gz"
          if ((Get-FileHash openssl.tar.gz -Algorithm SHA256).Hash -ne $env:OPENSSL_SHA256) {
            throw "openssl.tar.gz: checksum mismatch"
          }
          tar xf openssl.tar.gz
          Set-Location "openssl-$env:OPENSSL_VERSION"
          # no-shared selects the static runtime (/MT); no-module compiles the
          # legacy provider into libcrypto.
          perl Configure "${{ matrix.openssl_target }}" no-shared no-module no-tests no-docs
          Select-String -Path makefile -Pattern '^(INSTALLTOP|OPENSSLDIR|ENGINESDIR|MODULESDIR)_dir='
          nmake
          nmake install_sw DESTDIR="$env:OSSLSIGNCODE_DEPS\openssl"

      # Handle the CETCOMPAT patch for older versions to support building
      # past tags.
      - name: Checkout patch (from workflow ref)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }} # the release branch/ref, has the patch
          sparse-checkout: .github/workflows/patches
          sparse-checkout-cone-mode: false
          path: ci-patches
      - name: Apply CETCOMPAT arch guard
        shell: bash
        run: |
          set -euo pipefail
          # Skip if the tag already contains the fix
          if grep -qE 'MSVC_C_ARCHITECTURE_ID MATCHES' cmake/SetCompilerFlags.cmake;  then
            echo "Fix already present; nothing to patch."
            exit 0
          fi
          if git apply --3way --check ci-patches/.github/workflows/patches/cetcompat-arch-guard.patch 2>/dev/null; then
            git apply --3way ci-patches/.github/workflows/patches/cetcompat-arch-guard.patch
            echo "Patch applied cleanly."
          else
            echo "Context mismatch on this tag; falling back to in-place guard."
            perl -0pi -e 's{(\s*)target_link_options\(\$\{target\} PRIVATE /CETCOMPAT\)}{$1if(MSVC_C_ARCHITECTURE_ID MATCHES "^(X86|x64|AMD64)\$")\n$1 target_link_options(\$\{target\} PRIVATE /CETCOMPAT)\n$1endif()}g' cmake/SetCompilerFlags.cmake
          fi
          git --no-pager diff -- cmake/SetCompilerFlags.cmake || true

      # msvc-dev-cmd sets VCPKG_ROOT, which makes CMakeLists.txt load the vcpkg
      # toolchain with the Ninja generator, so clear it. zlib names its static
      # library zs.lib, which FindZLIB does not search for.
      - name: Configure
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue
          cmake -G Ninja -S "${{ github.workspace }}" -B build `
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DOPENSSL_ROOT_DIR="$env:OSSLSIGNCODE_DEPS\openssl\Program Files\OpenSSL" `
            -DOPENSSL_USE_STATIC_LIBS=TRUE `
            -DZLIB_INCLUDE_DIR="$env:OSSLSIGNCODE_DEPS\zlib\include" `
            -DZLIB_LIBRARY="$env:OSSLSIGNCODE_DEPS\zlib\lib\zs.lib"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Verify the binary is self-contained
        run: |
          $deps = dumpbin /nologo /dependents build/osslsigncode.exe
          $deps
          if ($deps -match '(?i)vcruntime|msvcp|api-ms-win-crt|ucrtbase|libcrypto|libssl|zlib') {
            throw "binary depends on a non-system DLL"
          }
          $version = build/osslsigncode.exe --version
          if (-not ($version -match "OpenSSL $env:OPENSSL_VERSION ")) {
            $version
            throw "binary does not use the OpenSSL $env:OPENSSL_VERSION built above"
          }

      - name: Test
        working-directory: build
        run: |
          ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Upload the errors
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: errors-${{matrix.os}}
          path: |
            ${{github.workspace}}/build/Testing/Temporary/LastTest.log
            ${{github.workspace}}/build/Testing/conf/makecerts.log
            ${{github.workspace}}/build/Testing/logs/server.log
            ${{github.workspace}}/build/Testing/logs/port.log

      - name: Package
        shell: bash
        run: |
          asset="osslsigncode-${VERSION}-windows-${{matrix.arch}}"
          mkdir -p "stage/${asset}"
          cp build/osslsigncode.exe "stage/${asset}/"
          cp COPYING "stage/${asset}/" 2>/dev/null || true
          (cd stage && 7z a -tzip "../${asset}.zip" "${asset}")
          sha256sum "${asset}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-${{matrix.arch}}
          path: osslsigncode-*-windows-*.zip
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Publish: collect every artifact, generate SHA256SUMS.txt, attach to release.
  # --------------------------------------------------------------------------
  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create/modify the release
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          echo "----- SHA256SUMS.txt -----"
          cat SHA256SUMS.txt

      - name: Create / update the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
