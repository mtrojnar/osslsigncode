name: Codespell

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: codespell-project/actions-codespell@master
        with:
          skip: '*.pem'
